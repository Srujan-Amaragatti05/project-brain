version: '1.0'
llm:
  provider: gemini
  model: 'gemini-flash-latest'
  timeout_sec: 70
analysis:
  depth: fast
  include_tests: false
  ignore:
  - .brain/
  - brain.yaml
  - .git/
  - node_modules/
  - venv/
  - .venv/
  - __pycache__/
  - env/
  - .env/
  - .coverage
  - build/
diff:
  mode: function
export:
  full_code:
    include_tests: false
    max_file_size_kb: 200
  manual_add:
    allow_duplicates: true
  changes:
    mode: function
    include_context: true
    output_path: .brain/exports/code_changes.txt
  ignore:
  - .brain/
  - brain.yaml
  - .git/
  - node_modules/
  - venv/
  - .venv/
  - __pycache__/
  - env/
  - .env/
  - .coverage
  - tests/
  - build/
  - project_brain.egg-info/
  - .pytest_cache/
explain:
  level: detailed
  include_risks: true
output:
  format: text
