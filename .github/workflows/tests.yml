name: Tests

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    name: Python ${{ matrix.python-version }} • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest

        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project + dev dependencies
        run: pip install -e .[dev]

      - name: Configure PYTHONPATH
        shell: bash
        run: echo "PYTHONPATH=src" >> $GITHUB_ENV

      - name: Upload install logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-logs-${{ matrix.os }}-${{ matrix.python-version }}
          path: install-output.txt

      - name: Run tests
        run: pytest tests/ -v 

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.python-version }}
          path: test-output.txt
